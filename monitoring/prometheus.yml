global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lavka-gateway'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'lavka-gateway'

  - job_name: 'lavka-auth-service'
    static_configs:
      - targets: ['auth-service:9091']
        labels:
          service: 'lavka-auth-service'

  - job_name: 'lavka-catalog-service'
    static_configs:
      - targets: ['catalog-service:9092']
        labels:
          service: 'lavka-catalog-service'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'lavka-host'
